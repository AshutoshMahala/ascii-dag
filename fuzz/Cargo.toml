[package]
name = "ascii-dag-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ascii-dag]
path = ".."
features = ["arena"]

# Fuzz target: Arena allocator
[[bin]]
name = "fuzz_arena"
path = "fuzz_targets/fuzz_arena.rs"
test = false
doc = false
bench = false

# Fuzz target: DAG construction and heap layout
[[bin]]
name = "fuzz_dag_layout"
path = "fuzz_targets/fuzz_dag_layout.rs"
test = false
doc = false
bench = false

# Fuzz target: Arena-based layout (critical path)
[[bin]]
name = "fuzz_arena_layout"
path = "fuzz_targets/fuzz_arena_layout.rs"
test = false
doc = false
bench = false
