[package]
name = "ascii-dag"
version = "0.10.1"
edition = "2024"
authors = ["Ash"]
license = "MIT OR Apache-2.0"
description = "Zero-dependency, no_std compatible ASCII DAG renderer. Visualize error chains, dependency trees, and graphs in the terminal."
repository = "https://github.com/AshutoshMahala/ascii-dag"
keywords = ["tree", "graph", "sugiyama", "terminal", "layout"]
categories = ["data-structures", "visualization", "no-std"]
readme = "README.md"
rust-version = "1.92"
# Zero dependencies by default

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "generic"]
std = ["alloc"]
alloc = []            # Use heap allocation (Vec, String, HashMap)
warnings = ["std"]
# Optional modules for bundle size reduction
# Generic cycle detection, topological sort, impact analysis, metrics.
# Requires std, not just alloc: these algorithms track visited sets keyed by
# the caller's own id type, bounded `Eq + Hash`. Without std the crate aliases
# HashSet/HashMap to their BTree counterparts, which need `Ord` instead — a
# bound the public signatures do not ask for. Declared as `alloc` until 0.10,
# where it never compiled.
generic = ["std"]
serde = []            # Future: serialization support
# Experimental: arena-based allocation for no_std/embedded
arena = []            # Arena allocator mode - fast but uses more memory upfront
# Arena index size selection (mutually exclusive - pick ONE)
# Smaller indices = less memory, but limits max graph size
arena-idx-u8 = ["arena"]   # Max 255 nodes/edges - tiny MCUs (2-8KB RAM)
arena-idx-u16 = ["arena"]  # Max 65535 nodes/edges - small MCUs (16-256KB RAM)  
arena-idx-u32 = ["arena"]  # Max 4B nodes/edges - desktop/servers (default if none selected)
# Internal marker for embedded examples that require custom targets
embedded_no_std = []       # Used to exclude embedded examples from --all-targets builds

[dev-dependencies]

[lib]
name = "ascii_dag"
path = "src/lib.rs"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "topological_sort"
path = "examples/topological_sort.rs"
required-features = ["generic"]

[[example]]
name = "dependency_analysis"
path = "examples/dependency_analysis.rs"
required-features = ["generic"]

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols
panic = "abort"     # Remove panic unwinding (critical for WASM size)
# Embedded users should add panic = "abort" in their own Cargo.toml if not using this profile

[profile.dev]
# Note: panic = "abort" removed - set in downstream project for embedded targets

