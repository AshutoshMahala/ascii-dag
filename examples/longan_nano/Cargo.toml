[package]
name = "longan-ascii-dag"
version = "0.1.0"
edition = "2021"

[dependencies]
# arena-idx-u8 keeps index storage to one byte per node — this part has
# 32 KB of SRAM. The demo's buffers take 7 KiB, with additional stack
# needed by layout/render calls. No heap allocator anywhere.
ascii-dag = { path = "../../", default-features = false, features = ["arena-idx-u8", "layout-horizontal"] }
longan-nano = { git = "https://github.com/riscv-rust/longan-nano", features = ["lcd"] }
riscv-rt = "0.11"
riscv = { version = "0.10", features = ["critical-section-single-hart"] }
panic-halt = "0.2"
embedded-graphics = "0.7"

[[bin]]
name = "longan_demo"
path = "src/main.rs"

# Size-first: the GD32VF103 has 128 KB flash, and the default release
# profile (opt-level 3, no LTO) does not fit.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
